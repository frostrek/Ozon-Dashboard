name: Ozon Pipeline — Account C

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run_account_c]

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libgbm1 \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2t64 \
            --no-install-recommends

      - name: Restore translation cache
        uses: actions/cache@v4
        with:
          path: translate-cache.json
          key: translate-cache-account-c-${{ github.ref_name }}
          restore-keys: |
            translate-cache-account-c-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run pipeline
        env:
          OZON_CLIENT_ID:            ${{ secrets.OZON_CLIENT_ID_C }}
          OZON_API_KEY:              ${{ secrets.OZON_API_KEY_C }}
          TELEGRAM_BOT_TOKEN:        ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: "${{ secrets.TELEGRAM_CHAT_IDS_C }},${{ secrets.TELEGRAM_CHAT_IDS_ADMINS }}"
          ACCOUNT_LABEL:             ${{ secrets.ACCOUNT_LABEL_C }}
          STATUS:                    "awaiting_packaging"
          DAYS_BACK:                 "7"
        run: bun run main.js

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-c-run-${{ github.run_id }}
          path: runs/
          retention-days: 7